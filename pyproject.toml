[project]
name = "course-assignments"
version = "0.1.0"
description = "Домашние задания и мини-проекты"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
flask = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "sqlalchemy>=2.1.9",
]
lint = [
    "ruff>=0.16.10",
]
tests = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 120

[tool.pytest]
addopts = ["--doctest-modules"]
testpaths = [
    "tests",
    "homeworks/homeworks_03"
]
