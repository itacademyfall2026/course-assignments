<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Кадр</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #141513;
      background: #f4f4ef;
    }

    main {
      width: 100%;
      max-width: 360px;
      padding: 32px;
      border: 1px solid #d9d9d0;
      border-radius: 12px;
      background: #fff;
    }

    h1 { margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; }

    input, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #777;
      border-radius: 6px;
      font: inherit;
    }

    input { margin-bottom: 20px; }
    button { color: #fff; background: #141513; cursor: pointer; }
    button:hover { background: #343630; }
    :focus-visible { outline: 3px solid #486cce; outline-offset: 3px; }
  </style>
</head>

<body>
  <main>
    <h1>Вход</h1>
    <form id="login-form" action="/login" method="post">
      <label for="username">Имя пользователя</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Войти</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById('login-form');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Выполняется вход…';

      try {
        const response = await fetch('/login_json', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: form.elements.username.value,
            password: form.elements.password.value
          })
        });

        status.textContent = response.ok
          ? 'Вход выполнен успешно.'
          : `Не удалось войти (код ${response.status}).`;
      } catch (error) {
        status.textContent = 'Ошибка сети. Попробуйте ещё раз.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>

</html>
